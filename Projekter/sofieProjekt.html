<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sofies Projekt</title>

<link rel="icon" type="image/png" href="../logo.png">

<style>


:root{
    --black:#111111;
    --grey:#666666;
    --light:#f8f8f8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Helvetica Neue", Arial, sans-serif;
    background:var(--light);
    color:var(--black);
    overflow-x:hidden;
}

img{
    max-width:100%;
}

@media(max-width:768px){

    .navbar{
        justify-content:center;
        flex-direction:column;

        height:auto;

        padding:20px;
    }

    .logo{
        position:relative;
        left:0;
    }

    .logo img{
        position:relative;

        top:0;

        height:75px;
    }

    .nav-links{

        margin-top:15px;

        display:grid;

        grid-template-columns:repeat(2,auto);

        gap:10px 20px;

        justify-content:center;

        text-align:center;
    }

    .back-arrow{

        font-size:32px;

        left:25px;

        top:75px;
    }

    .project-hero{

        height:50vh;

        margin-top:140px;
    }

    .project-header{

        padding:0 25px;

        margin:60px auto;
    }

    .project-header h1{

        font-size:2.5rem;
    }

    .project-content{

        padding:0 25px 80px;
    }

    .gallery{

        padding:0 25px 80px;

        grid-template-columns:1fr;
    }

    .social-links a{

        width:40px;
        height:40px;
    }

}

/* ---------------- NAVBAR ---------------- */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;

    background:rgba(248,248,248,.75);
    backdrop-filter:blur(20px);

    border-bottom:1px solid rgba(0,0,0,.08);

    overflow:visible;
}

.navbar{
    max-width:1400px;
    margin:auto;

    height:50px;

    padding:0 50px;

    display:flex;
    justify-content:flex-end;
    align-items:center;

    position:relative;
}

/* LOGO */

.logo{
    position:absolute;
    left:50px;
    top:0;
}

.logo img{
    height:100px;

    display:block;

    transform:rotate(8deg);

    transition:.4s ease;

    cursor:pointer;
}

.logo img.spin{
    animation:spinLogo 1s ease;
}

@keyframes spinLogo{

    0%{
        transform:rotate(-56deg);
    }

    100%{
        transform:rotate(295deg);
    }
}

.logo img:hover{
    transform:rotate(-64deg);
}

/* MENU */

.nav-links{
    display:flex;
    gap:40px;
    list-style:none;
}

.nav-links a{
    text-decoration:none;
    color:#111;

    text-transform:uppercase;

    letter-spacing:2px;

    font-size:.85rem;

    transition:.3s;
}

.nav-links a:hover{
    color:#777;
}

/* BACK ARROW */

.back-arrow{
    position:fixed;

    top:80px;
    left:100px;

    font-size:50px;

    color:#111;

    text-decoration:none;

    font-weight:300;

    z-index:2500;

    transition:
        color .3s ease,
        transform .3s ease;
}

.back-arrow:hover{

    color:#777;

    transform:translateX(-4px);
}

/* HERO */

.project-hero{
    height:90vh;

    overflow:hidden;

    margin-top:100px;
}

.project-hero img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* PROJEKT INFO */

.project-header{

    max-width:1100px;

    margin:120px auto 80px auto;

    padding:0 60px;
}

.project-header h1{

    font-size:clamp(3rem,8vw,6rem);

    font-weight:200;

    margin-bottom:15px;
}

.project-meta{

    color:#777;

    letter-spacing:1px;
}

/* BRØDTEKST */

.project-content{

    max-width:900px;

    margin:auto;

    padding:0 60px 120px;
}

.project-content p{

    line-height:2;

    font-size:1.1rem;

    margin-bottom:35px;
}

/* GALLERI */

.gallery{

    max-width:1400px;

    margin:auto;

    padding:0 60px 150px;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(350px,1fr));

    gap:20px;
}

.gallery img{

    width:100%;

    height:350px;

    object-fit:cover;
	
	border-radius:12.5px;  	/* ændr tallet her */
	
	cursor:pointer;

    transition:
		transform .3s ease,
        box-shadow .3s ease;
}

.gallery img:hover{

    transform:scale(1.02);
	
	    box-shadow:
    0 15px 40px rgba(0,0,0,.15);
}

/* FOOTER */

footer{
    background:#111;

    color:white;

    text-align:center;

    padding:120px 40px;
}

footer h2{
    font-weight:300;

    margin-bottom:20px;
}

footer p{
    opacity:.7;

    margin-bottom:10px;
}

.social-links{
    margin-top:30px;

    display:flex;
    justify-content:center;
    gap:20px;
}

.social-links a{

    width:50px;
    height:50px;

    border-radius:50%;

    background:white;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.3s;

    color:#111;
}

.social-links a:hover{

    transform:translateY(-3px);

    background:#d9d9d9;
}

.social-links svg{

    width:24px;
    height:24px;
}

/* ---------- LIGHTBOX ---------- */

.lightbox{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.9);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:9999;
}

.lightbox img{

    max-width:90%;
    max-height:90vh;

    border-radius:20px;

    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.lightbox-close{

    position:absolute;

    top:30px;
    right:40px;

    color:white;

    font-size:50px;

    cursor:pointer;

    font-weight:200;
}

</style>

</head>

<body>

<a href="../index.html" class="back-arrow">←</a>

<header>

<nav class="navbar">

<div class="logo">
    <a href="../index.html" id="logoLink">
        <img src="../logo.png" alt="Logo" id="logo">
    </a>
</div>

<ul class="nav-links">
    <li><a href="../index.html">Forside</a></li>
    <li><a href="../index.html#projekter">Projekter</a></li>
    <li><a href="../index.html#about">Semester</a></li>
    <li><a href="../index.html#program">Program</a></li>
</ul>

</nav>

</header>


<section class="project-hero">

<p class="project-meta">

</p>

<section class="project-content">

<p>

<p>

</p>

</section>

<section class="gallery">

<img src="../Gruppe1.jpg" alt="">
<img src="../Gruppe1.jpg" alt="">
<img src="../Gruppe1.jpg" alt="">

</section>

<footer>

    <h2>Kunst & Teknologi</h2>

    <p>Aalborg Universitet</p>
    <p>2026</p>

    <div class="social-links">

        <a href="https://www.facebook.com/aauart"
           target="_blank"
           aria-label="Facebook">

            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/>
            </svg>

        </a>

        <a href="https://www.instagram.com/kunstogteknologi/"
           target="_blank"
           aria-label="Instagram">

            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm0 2h10c1.654 0 3 1.346 3 3v10c0 1.654-1.346 3-3 3H7c-1.654 0-3-1.346-3-3V7c0-1.654 1.346-3 3-3zm11 1a1 1 0 100 2 1 1 0 000-2zM12 7a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6z"/>
            </svg>

        </a>

    </div>

</footer>

<div class="lightbox" id="lightbox">

    <span class="lightbox-close">&times;</span>

    <img id="lightbox-img" src="">

</div>

<script>

const galleryImages =
document.querySelectorAll(".gallery img");

const lightbox =
document.getElementById("lightbox");

const lightboxImg =
document.getElementById("lightbox-img");

const closeBtn =
document.querySelector(".lightbox-close");

galleryImages.forEach(img => {

    img.addEventListener("click", () => {

        lightbox.style.display = "flex";

        lightboxImg.src = img.src;

    });

});

closeBtn.addEventListener("click", () => {

    lightbox.style.display = "none";

});

lightbox.addEventListener("click", (e) => {

    if(e.target === lightbox){

        lightbox.style.display = "none";

    }

});



const logo = document.getElementById("logo");
const logoLink = document.getElementById("logoLink");

logoLink.addEventListener("click", (e) => {

    e.preventDefault();

    logo.classList.remove("spin");

    void logo.offsetWidth;

    logo.classList.add("spin");

    setTimeout(() => {

        window.location.href = "../index.html";

    }, 800);

});
</script>

</body>
</html>
